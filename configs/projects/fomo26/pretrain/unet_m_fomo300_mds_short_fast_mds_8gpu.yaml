# @package _global_
#
# Full-node Nebius H100 variant of the fast MDS-streaming recipe.
defaults:
  - /default_pretrain
  - /model/unet_m@model
  - /hardware/1node8gpus@hardware
  - _self_

task: PT901_FOMO300_MDS
root: fomo26
stem: pretrain

checkpoint_run_id:

data:
  train_split: split_mihir_90_10
  fold: 0

training:
  batch_size: 2
  accumulate_grad_batches: 1
  patch_size: [96, 96, 96]
  mask_ratio: 0.6
  max_samples: 262144
  steps_per_epoch: 128
  val_steps_per_epoch: 16
  warmup_ratio: 0.01
  check_val_every_n_epoch: 1
  rec_loss_masked_only: true

model:
  ckpt_every_n_epoch: 1
  use_skip_connections: false

transforms:
  cpu_tr_transforms: pretrain_CPU_train_transforms_lite
  gpu_tr_transforms: pretrain_GPU_train_transforms_with_spatial

lightning:
  data_module: MDSPretrainDataModule
  _data_module:
    mds_root: ${oc.env:FOMO300_MDS_ROOT,/data/mihir-stuff/FOMO300/mds}
    mds_train_split: train
    mds_val_split: val
    prefetch_factor: 8
    assert_disjoint_batches: 100

logger:
  wandb_logging: true
  mlflow_logging: false
  log_every_n_steps: 10
  log_images_every_n_epoch: 999

profiler:
  enabled: false
  profile_every_n_steps: 50
  warmup_steps: 5
