# @package _global_
#
# Streams directly from the original FOMO300 MDS shards instead of the
# one-.pt-file-per-sample conversion. This keeps the fast single-GPU recipe
# intact while exercising the MDS reader.
defaults:
  - /default_pretrain
  - /model/unet_m@model
  - /hardware/1gpu12cpu@hardware
  - _self_

task: PT901_FOMO300_MDS
root: fomo26
stem: pretrain

checkpoint_run_id:

data:
  # Kept for Hydra output naming and existing metadata loading. The MDS data
  # module reads sample membership from the MDS shard index.
  train_split: split_mihir_90_10
  fold: 0

training:
  batch_size: 2
  accumulate_grad_batches: 1
  patch_size: [96, 96, 96]
  mask_ratio: 0.6
  max_samples: 8192
  steps_per_epoch: 256
  val_steps_per_epoch: 16
  warmup_ratio: 0.1
  check_val_every_n_epoch: 1
  rec_loss_masked_only: true

model:
  ckpt_every_n_epoch: 1
  use_skip_connections: false

hardware:
  compile_mode: reduce-overhead

transforms:
  cpu_tr_transforms: pretrain_CPU_train_transforms_lite
  gpu_tr_transforms: pretrain_GPU_train_transforms_with_spatial

lightning:
  data_module: MDSPretrainDataModule
  _data_module:
    mds_root: ${oc.env:FOMO300_MDS_ROOT,/data/mihir-stuff/FOMO300/mds}
    mds_train_split: train
    mds_val_split: val
    prefetch_factor: 8
    assert_disjoint_batches: 100

logger:
  wandb_logging: true
  mlflow_logging: false
  log_every_n_steps: 10
  log_images_every_n_epoch: 1

profiler:
  enabled: true
  profile_every_n_steps: 50
  warmup_steps: 5
