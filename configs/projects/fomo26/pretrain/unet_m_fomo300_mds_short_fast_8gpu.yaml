# @package _global_
#
# 8-GPU variant of unet_m_fomo300_mds_short_fast.yaml. Same SSL recipe and
# per-GPU batch size, but trains across one full Nebius H100 node via
# Lightning's DDP strategy.
#
# Differences from the 1-GPU fast config (and why):
#   * `/hardware/1node8gpus@hardware`: num_devices=8, num_workers=112 (14
#     workers per GPU after the integer divide in the data module wiring).
#   * compile_mode left at the hardware preset's `default`. The `reduce-
#     overhead` path the 1-GPU run uses captures CUDA graphs, which is
#     known to be fragile when combined with NCCL collectives in DDP. We
#     can revisit once we have a stable 8-GPU baseline.
#   * `training.max_samples=262144` (= 32768 * 8) keeps the total optimizer
#     step count at 2048, matching the 1-GPU comparison so the throughput
#     ratio is one-axis (samples/s and wall-clock for the same step count).
#
# Launch (single-process; Lightning spawns the other 7 ranks itself):
#   sbatch --gres=gpu:8 --gpus-per-task=8 \
#     scripts/nebius_pretrain.sbatch \
#     projects/fomo26/pretrain/unet_m_fomo300_mds_short_fast_8gpu \
#     training.batch_size=16 \
#     training.max_samples=262144 \
#     training.steps_per_epoch=128 \
#     training.val_steps_per_epoch=16 \
#     training.warmup_ratio=0.01 \
#     profiler.enabled=false \
#     logger.log_images_every_n_epoch=999 \
#     logger.wandb_logging=true
defaults:
  - /default_pretrain
  - /model/unet_m@model
  - /hardware/1node8gpus@hardware
  - _self_

task: PT901_FOMO300_MDS
root: fomo26
stem: pretrain

checkpoint_run_id:

data:
  train_split: split_mihir_90_10
  fold: 0

training:
  batch_size: 2
  accumulate_grad_batches: 1
  patch_size: [96, 96, 96]
  mask_ratio: 0.6
  max_samples: 262144
  steps_per_epoch: 128
  val_steps_per_epoch: 16
  warmup_ratio: 0.01
  check_val_every_n_epoch: 1
  rec_loss_masked_only: true

model:
  ckpt_every_n_epoch: 1
  use_skip_connections: false

transforms:
  cpu_tr_transforms: pretrain_CPU_train_transforms_lite
  gpu_tr_transforms: pretrain_GPU_train_transforms_with_spatial

logger:
  wandb_logging: true
  mlflow_logging: false
  log_every_n_steps: 10
  log_images_every_n_epoch: 999

profiler:
  enabled: false
  profile_every_n_steps: 50
  warmup_steps: 5
